name: CI

on:
  push:
    paths:
      - "doctor-booking-app/**"
  pull_request:
    paths:
      - "doctor-booking-app/**"

defaults:
  run:
    working-directory: doctor-booking-app

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
          POSTGRES_DB: agenda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://agenda:agenda@localhost:5432/agenda_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: doctor-booking-app/backend
        run: pip install -e ".[dev]"
      - name: Run Alembic migrations
        working-directory: doctor-booking-app/backend
        run: alembic upgrade head
      - name: Run tests
        working-directory: doctor-booking-app/backend
        run: pytest -q
      - name: Lint
        working-directory: doctor-booking-app/backend
        run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: doctor-booking-app/frontend
        run: npm ci
      - name: Type-check
        working-directory: doctor-booking-app/frontend
        run: npx tsc -b
      - name: Lint
        working-directory: doctor-booking-app/frontend
        run: npm run lint
      - name: Build
        working-directory: doctor-booking-app/frontend
        run: npm run build
