# Home Assistant Lovelace Dashboard — Lights & Security focus
#
# HOW TO IMPORT:
#   1. In the Home Assistant app/web UI: Settings -> Dashboards -> "+ Add Dashboard"
#      -> "New dashboard from scratch".
#   2. Open the new dashboard, tap the three-dot menu (top right) -> "Edit Dashboard"
#      -> three-dot menu again -> "Edit in YAML".
#   3. Delete the placeholder content and paste this entire file, then Save.
#
# NOTES:
#   - Entity IDs below are best-effort guesses slugified from your device names
#     (Home Assistant's standard convention, e.g. "Bathroom Light" -> light.bathroom_light).
#     They were not retrievable directly via the MCP connector (it only exposes friendly
#     names/areas/state, not raw entity_ids). If a tile shows "Entity not available",
#     open that card in the visual editor and re-pick the entity from the autocomplete
#     list -- it's a 5-second fix per entity, and you'll likely need to do this for a
#     handful of them.
#   - Entities that were "unavailable" at discovery time (e.g. some lights, Master
#     Bedroom TV) are included on purpose -- they'll light up automatically once back
#     online, no dashboard edit needed.
#   - Living Room TV and Soundbar each appeared twice in the raw data (duplicate
#     integration exposure) -- only one of each is included here, per your review.
#   - Motion Sensor - AC4 is placed under Bedroom (you confirmed that's its real location,
#     even though the raw data didn't tag it with an area).
#   - Small Blind, Big Blind, and Sunscreen are three independent covers -- each has its
#     own separate control, no grouping.
#   - The "Other" tab (media players, vacuum, switches, to-do list) is intentionally last
#     and kept compact, since your focus is lights + security; sensors are secondary.

title: Home
